; GatewayWorker 即时消息网关（前台不要加 -d，supervisor 需要进程保持在前台）
[program:ticket-gateway]
command=php /var/www/ticket/artisan gateway:start
directory=/var/www/ticket
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/ticket/storage/logs/gateway-supervisor.log
