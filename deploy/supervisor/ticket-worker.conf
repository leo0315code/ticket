; 队列 worker：发邮件、通知等异步任务
; 放到 /etc/supervisor/conf.d/ 后：supervisorctl reread && supervisorctl update
[program:ticket-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ticket/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/ticket
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/ticket/storage/logs/worker.log
stopwaitsecs=3600
